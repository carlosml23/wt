# ~/.tmux.conf — tuned for parallel Claude Code sessions across git worktrees.
# Self-contained (no plugin manager) so it stays reliable. Reload after edits
# with:  Ctrl-a r   (or `tmux source-file ~/.tmux.conf`).

# ── Colors ───────────────────────────────────────────────────────────────────
# Claude Code emits truecolor (24-bit) output — without this it looks washed out.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",iterm2:RGB"

# ── Prefix ───────────────────────────────────────────────────────────────────
# Ctrl-a instead of the default Ctrl-b: `a` sits next to Ctrl, easier one-hand
# chord. Press Ctrl-a TWICE to send a literal Ctrl-a to the shell (start of line).
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Extended keys (Shift+Enter, etc.) ────────────────────────────────────────
# Without this, tmux swallows the modern key sequences that /terminal-setup makes
# iTerm2 send — so Shift+Enter (newline in Claude Code) collapses to plain Enter.
set -s extended-keys on
set -as terminal-features ",xterm-256color:extkeys"
set -as terminal-features ",iterm2:extkeys"

# ── Responsiveness ───────────────────────────────────────────────────────────
set -sg escape-time 10        # no lag after Esc (matters for editors inside panes)
set -g focus-events on        # let editors/agents know when a pane gains focus
set -g display-time 2000      # keep status messages up longer (ms)
set -g history-limit 100000   # deep scrollback — agents print a LOT

# ── Mouse ────────────────────────────────────────────────────────────────────
# Click to select a pane, drag borders to resize, wheel to scroll history.
set -g mouse on

# ── Sane numbering ───────────────────────────────────────────────────────────
set -g base-index 1           # windows start at 1 (matches keyboard layout)
setw -g pane-base-index 1
set -g renumber-windows on    # keep window numbers gap-free when one closes

# Keep the session name you gave it (the issue id) — never auto-rename.
setw -g allow-rename off
setw -g automatic-rename off

# ── Splitting: keep the current worktree dir in new panes/windows ────────────
# Default splits reset to $HOME; these inherit the pane's cwd (your worktree).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Spanish ISO keyboard: `|` is Alt+1 (awkward). `v` = vertical split (panes
# side by side) — same as `|`, which stays bound for tutorial muscle memory.
bind v split-window -h -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Quality-of-life keys ─────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"
# Vim-style pane navigation (Ctrl-a then h/j/k/l).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Session picker (jump between issues): Ctrl-a then s  — built in, shown here for note.

# ── Copy mode (vi keys; wheel scroll enters it automatically) ────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind Enter copy-mode          # Ctrl-a Enter to scroll back through agent output

# ── Status bar: make "which issue is this?" obvious at a glance ──────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-style        "bg=#1c1c1c fg=#c0c0c0"
# Left: big, bright session name = the Linear issue (e.g.  ORA-38 ).
set -g status-left         "#[bg=#8a5a2b,fg=#ffffff,bold] #S #[bg=#1c1c1c,fg=#8a5a2b]▌ "
set -g status-left-length  40
# Right: which host / clock — cheap context when you have many panes.
set -g status-right        "#[fg=#808080]#h #[fg=#c0c0c0]%H:%M"
set -g status-right-length 40

# Windows within a session: show  index : current-folder  (truncated to 24 chars
# with … so long worktree names don't blow out the bar). #{b:...} = basename of
# the active pane's cwd, so the label tracks wherever you cd to.
setw -g window-status-current-style "bg=#3a3a3a,fg=#ffffff,bold"
setw -g window-status-current-format " #I:#{=/24/…:#{b:pane_current_path}} "
setw -g window-status-format        " #I:#{=/24/…:#{b:pane_current_path}} "

# Active pane border in the warm-brown accent so the focused worktree stands out.
set -g pane-border-style        "fg=#3a3a3a"
set -g pane-active-border-style "fg=#8a5a2b"

# Mouse drag-select copies straight to the macOS clipboard.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
